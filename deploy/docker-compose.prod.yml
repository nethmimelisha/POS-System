x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PG 18+ images keep data in a versioned subdirectory; mount the parent.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: migrate
    image: pos-api-migrate:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.production
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: runtime
    image: pos-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ./.env.production
    expose:
      - "4000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  backup:
    image: pos-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - ./.env.production
    command: ["node", "dist/src/ops/backupScheduler.js"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - backups:/backups
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: pos-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    logging: *default-logging

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    environment:
      POS_DOMAIN: ${POS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/edge.conf:/etc/nginx/templates/default.conf.template:ro
    logging: *default-logging

volumes:
  db-data:
  backups:
